[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof"
version = "0.2.0rc3.dev0"
description = "Independent verification for AI-generated software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]
authors = [{name = "AgentProof contributors"}]
license = "Apache-2.0"
keywords = ["ai", "verification", "github-actions", "testing", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/GenRamzi/AgentProof"
Repository = "https://github.com/GenRamzi/AgentProof"
Issues = "https://github.com/GenRamzi/AgentProof/issues"
Changelog = "https://github.com/GenRamzi/AgentProof/blob/main/CHANGELOG.md"
Documentation = "https://github.com/GenRamzi/AgentProof/tree/main/docs"

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.setuptools.packages.find]
include = ["agentproof*"]

[tool.setuptools.package-data]
agentproof = ["schema_data/*.json"]

[project.optional-dependencies]
dev = ["build", "coverage", "mypy", "packaging", "pytest", "ruff", "pip-audit", "twine"]
signing = ["cryptography>=42.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
