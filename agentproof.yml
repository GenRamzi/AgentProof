version: 1
verification:
  setup_command: python -m pip install -e ".[dev]"
  test_command: python -m pytest -q
  require_tests: true
  proof_tests: auto
integrity:
  deleted_tests: warning
  new_skips: warning
  assertion_weakening: review
  ci_changes: review
coverage:
  minimum_delta: 0
dependencies:
  lockfile_changes: review
network:
  mode: deny
  domains: []
receipt:
  signature_required: false
