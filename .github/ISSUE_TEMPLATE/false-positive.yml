name: False positive
description: Report a finding that should not have blocked or warned.
title: "[false-positive] "
labels: [false-positive]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the repository shape, diff, policy, and observed finding.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
