name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install release tooling
        run: python -m pip install ".[dev]"
      - name: Validate release tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG_VERSION"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")
          tag_version = tag[1:]
          with open("pyproject.toml", "rb") as handle:
              package_version = tomllib.load(handle)["project"]["version"]
          try:
              parsed_tag = Version(tag_version)
              parsed_package = Version(package_version)
          except InvalidVersion as exc:
              raise SystemExit(f"Invalid PEP 440 release version: {exc}") from exc
          if tag_version != package_version or parsed_tag != parsed_package:
              raise SystemExit(
                  f"Release version mismatch: tag={tag_version}, package={package_version}"
              )
          is_prerelease = parsed_package.is_prerelease or parsed_package.is_devrelease
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AGENTPROOF_IS_PRERELEASE={'true' if is_prerelease else 'false'}\n")
          print(f"Validated {package_version}; prerelease={is_prerelease}")
          PY
      - name: Test release source
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Validate installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          agentproof explain AP001
      - name: Generate SBOM
        run: python tools/generate_sbom.py dist/SBOM.spdx.json
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Attest distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"
      - name: Upload distribution artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: agentproof-distribution
          path: dist/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ env.AGENTPROOF_IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
      - name: Publish stable release to PyPI with Trusted Publishing
        if: startsWith(github.ref, 'refs/tags/') && env.AGENTPROOF_IS_PRERELEASE == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
