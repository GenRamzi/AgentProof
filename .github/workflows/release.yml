name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install ".[dev]"
      - name: Test release source
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Validate installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          agentproof explain AP001
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Attest distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentproof-distribution
          path: dist/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*
      - name: Publish stable release to PyPI with Trusted Publishing
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: pypa/gh-action-pypi-publish@release/v1
