name: AgentProof CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Compile check
        run: python -m compileall -q agentproof
      - name: Ruff
        run: ruff check agentproof tests
      - name: Mypy
        run: mypy agentproof --ignore-missing-imports
      - name: Tests with coverage
        run: coverage run -m pytest -q && coverage report --fail-under=90
      - name: CLI doctor
        run: python -m agentproof doctor --repo .
      - name: Build distributions
        run: python -m build
      - name: Install wheel and smoke-test installed package
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          agentproof explain AP001
      - name: Dependency audit
        run: pip-audit --strict -r requirements-audit.txt
