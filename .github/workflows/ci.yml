name: AgentProof CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Compile check
        run: python -m compileall -q agentproof
      - name: Ruff
        run: ruff check agentproof tests
      - name: Mypy
        run: mypy agentproof --ignore-missing-imports
      - name: Tests with coverage
        run: coverage run -m pytest -q && coverage report --fail-under=90
      - name: CLI doctor
        run: python -m agentproof doctor --repo .
      - name: Build distributions
        run: python -m build
      - name: Install wheel and smoke-test installed package
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          agentproof explain AP001
      - name: Install source distribution and smoke-test
        run: |
          python -m venv /tmp/agentproof-sdist-venv
          /tmp/agentproof-sdist-venv/bin/python -m pip install --quiet --no-deps dist/*.tar.gz
          cd /tmp
          /tmp/agentproof-sdist-venv/bin/agentproof explain AP001
      - name: Generate and validate SBOM
        run: python tools/generate_sbom.py /tmp/SBOM.spdx.json && python -m json.tool /tmp/SBOM.spdx.json >/dev/null
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Dependency audit
        run: pip-audit --strict -r requirements-audit.txt
