name: AgentProof CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install . pytest
      - name: Compile check
        run: python -m compileall -q agentproof
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: CLI doctor
        run: python -m agentproof doctor --repo .
      - name: Package build
        run: python -m pip install build && python -m build
      - name: Dependency audit
        run: python -m pip install pip-audit && pip-audit --strict
