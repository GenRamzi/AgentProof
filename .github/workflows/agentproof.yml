name: AgentProof Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  verification:
    name: AgentProof / Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run AgentProof
        uses: ./
        with:
          test-command: python -m pytest -q
          policy: policies/strict.yml
          policy-preset: strict
          auto-proof: true

      - name: Upload SARIF findings
        if: always() && hashFiles('agentproof.sarif') != ''
        uses: github/codeql-action/upload-sarif@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          sarif_file: agentproof.sarif
