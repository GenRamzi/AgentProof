name: AgentProof Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verification:
    name: AgentProof / Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install ".[dev]"

      - name: Run AgentProof
        uses: ./
        with:
          setup-command: python -m pip install -e ".[dev]"
          test-command: python -m pytest -q
          policy: policies/strict.yml
          policy-preset: strict
          auto-proof: true

  sarif:
    name: AgentProof / SARIF Upload
    needs: verification
    if: always() && needs.verification.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download AgentProof artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentproof-verification

      - name: Upload SARIF findings
        if: hashFiles('agentproof.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: agentproof.sarif
