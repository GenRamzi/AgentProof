name: AgentProof Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  verification:
    name: AgentProof / Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run AgentProof
        uses: ./
        with:
          test-command: python -m pytest -q
          policy: policies/strict.yml
          policy-preset: strict
          auto-proof: true

      - name: Upload SARIF findings
        if: always() && hashFiles('agentproof.sarif') != ''
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: agentproof.sarif
