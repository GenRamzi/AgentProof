name: AgentProof Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  verification:
    name: AgentProof / Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AgentProof
        uses: ./
        with:
          test-command: python -m pytest -q
          policy: policies/strict.yml
          policy-preset: strict
          auto-proof: true

      - name: Upload SARIF findings
        if: always() && hashFiles('agentproof.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentproof.sarif
